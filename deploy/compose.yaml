name: kelpie

services:
  db:
    image: postgres:16-alpine
    pull_policy: always
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7-alpine
    pull_policy: always
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  migrate:
    image: ${KELPIE_IMAGE_REF:?Set KELPIE_IMAGE_REF in .env}
    pull_policy: always
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    command: ["node", "scripts/migrate.mjs"]

  app:
    image: ${KELPIE_IMAGE_REF:?Set KELPIE_IMAGE_REF in .env}
    pull_policy: always
    restart: unless-stopped
    env_file:
      - ${KELPIE_ENV_FILE:-.env}
    environment:
      APP_URL: ${APP_URL:?Set APP_URL in .env}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?Set BETTER_AUTH_URL in .env}
      CRON_SECRET: ${CRON_SECRET:?Set CRON_SECRET in .env}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      EMAIL_FROM: ${EMAIL_FROM:?Set EMAIL_FROM in .env}
      NODE_ENV: production
      STORAGE_DRIVER: local
      STORAGE_LOCAL_DIR: /data/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "${KELPIE_BIND_ADDRESS:-127.0.0.1}:${KELPIE_PORT:-3000}:3000"
    volumes:
      - uploads_data:/data/uploads
    tmpfs:
      - /tmp
    healthcheck:
      test:
        ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  jobs:
    image: ${KELPIE_IMAGE_REF:?Set KELPIE_IMAGE_REF in .env}
    pull_policy: always
    restart: unless-stopped
    init: true
    healthcheck:
      disable: true
    env_file:
      - ${KELPIE_ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      JOBS_CONCURRENCY: ${JOBS_CONCURRENCY:-5}
      NODE_ENV: production
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    command: ["node", "scripts/jobs-worker.cjs"]

  proxy:
    image: caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    pull_policy: always
    restart: unless-stopped
    init: true
    read_only: true
    network_mode: host
    environment:
      KELPIE_HTTPS_BIND_ADDRESS: ${KELPIE_HTTPS_BIND_ADDRESS:?Set KELPIE_HTTPS_BIND_ADDRESS in .env}
      KELPIE_PORT: ${KELPIE_PORT:-3000}
      PASSKEY_ORIGIN: ${PASSKEY_ORIGIN:?Set PASSKEY_ORIGIN in .env}
    depends_on:
      app:
        condition: service_healthy
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
    name: kelpie_postgres_data
  redis_data:
    name: kelpie_redis_data
  uploads_data:
    name: kelpie_uploads_data
  caddy_data:
    name: kelpie_caddy_data
  caddy_config:
    name: kelpie_caddy_config
