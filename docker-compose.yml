services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kelpie}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-kelpie}
    volumes:
      - kelpie_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - kelpie_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
  migrate:
    image: ${KELPIE_IMAGE:-ghcr.io/jusso-dev/kelpie:latest}
    pull_policy: always
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-kelpie}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-kelpie}
    depends_on:
      db:
        condition: service_healthy
    command: ["node", "scripts/migrate.mjs"]
    read_only: true
    tmpfs:
      - /tmp:uid=1001,gid=1001,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  app:
    image: ${KELPIE_IMAGE:-ghcr.io/jusso-dev/kelpie:latest}
    pull_policy: always
    restart: unless-stopped
    init: true
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-kelpie}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-kelpie}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?Set BETTER_AUTH_URL in .env}
      APP_URL: ${APP_URL:?Set APP_URL in .env}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-console}
      EMAIL_FROM: ${EMAIL_FROM:?Set EMAIL_FROM in .env}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      AWS_REGION: ${AWS_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AZURE_COMMUNICATION_EMAIL_CONNECTION_STRING: ${AZURE_COMMUNICATION_EMAIL_CONNECTION_STRING:-}
      AZURE_COMMUNICATION_EMAIL_SENDER: ${AZURE_COMMUNICATION_EMAIL_SENDER:-}
      CRON_SECRET: ${CRON_SECRET:?Set CRON_SECRET in .env}
      VIRUSTOTAL_API_KEY: ${VIRUSTOTAL_API_KEY:-}
      CLOUDFLARE_RADAR_API_TOKEN: ${CLOUDFLARE_RADAR_API_TOKEN:-}
      KELPIE_LOGO_DEV_TOKEN: ${KELPIE_LOGO_DEV_TOKEN:-}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_LOCAL_DIR: ${STORAGE_LOCAL_DIR:-/data/uploads}
      KELPIE_ALLOW_PRIVATE_NETWORKS: ${KELPIE_ALLOW_PRIVATE_NETWORKS:-false}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      APNS_TEAM_ID: ${APNS_TEAM_ID:-}
      APNS_KEY_ID: ${APNS_KEY_ID:-}
      APNS_PRIVATE_KEY: ${APNS_PRIVATE_KEY:-}
      APNS_BUNDLE_ID: ${APNS_BUNDLE_ID:-dev.kelpie.mobile}
      NODE_ENV: production
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "${KELPIE_BIND_ADDRESS:-127.0.0.1}:3000:3000"
    volumes:
      - kelpie_uploads:/data/uploads
    read_only: true
    tmpfs:
      - /tmp:uid=1001,gid=1001,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  jobs:
    image: ${KELPIE_IMAGE:-ghcr.io/jusso-dev/kelpie:latest}
    pull_policy: always
    restart: unless-stopped
    init: true
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-kelpie}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-kelpie}
      REDIS_URL: redis://redis:6379
      JOBS_CONCURRENCY: ${JOBS_CONCURRENCY:-5}
      APP_URL: ${APP_URL:?Set APP_URL in .env}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-console}
      EMAIL_FROM: ${EMAIL_FROM:?Set EMAIL_FROM in .env}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      AWS_REGION: ${AWS_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AZURE_COMMUNICATION_EMAIL_CONNECTION_STRING: ${AZURE_COMMUNICATION_EMAIL_CONNECTION_STRING:-}
      AZURE_COMMUNICATION_EMAIL_SENDER: ${AZURE_COMMUNICATION_EMAIL_SENDER:-}
      VIRUSTOTAL_API_KEY: ${VIRUSTOTAL_API_KEY:-}
      KELPIE_ALLOW_PRIVATE_NETWORKS: ${KELPIE_ALLOW_PRIVATE_NETWORKS:-false}
      APNS_TEAM_ID: ${APNS_TEAM_ID:-}
      APNS_KEY_ID: ${APNS_KEY_ID:-}
      APNS_PRIVATE_KEY: ${APNS_PRIVATE_KEY:-}
      APNS_BUNDLE_ID: ${APNS_BUNDLE_ID:-dev.kelpie.mobile}
      NODE_ENV: production
    command: ["node", "scripts/jobs-worker.cjs"]
    read_only: true
    tmpfs:
      - /tmp:uid=1001,gid=1001,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  kelpie_pg:
  kelpie_redis:
  kelpie_uploads:
